# CineBook AI - Spring Boot 3 Configuration
spring.application.name=cinebook-ai
server.port=8080

# MySQL Connection (UTF-8 enabled for Tamil, Telugu, Hindi, Devanagari, Japanese Unicode scripts)
spring.datasource.url=jdbc:mysql://localhost:3306/cinebook_ai?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=Sandyy@29
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Thymeleaf Template Engine
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Gemini AI Service (Optional)
cinebook.ai.gemini.api-key=${GEMINI_API_KEY:}
cinebook.ai.gemini.enabled=true
